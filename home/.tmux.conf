# ─── Compatibilité Ghostty ───
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Support du kitty keyboard protocol
# NB: 'extended-keys-format' n'existe pas en tmux 3.4 → retiré (cassait le source).
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# ─── Prefix : Ctrl+a (comme screen, plus ergonomique) ───
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Splits intuitifs ───
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Navigation vim-like entre panes ───
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Redimensionner les panes ───
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Fenêtres ───
bind c new-window -c "#{pane_current_path}"
set -g base-index 1
setw -g pane-base-index 1

# ─── Souris ───
set -g mouse on

# ─── Copie vim-like → presse-papier système (X11 via xclip) ───
setw -g mode-keys vi
# v: sélection · y: copie+quitte vers presse-papier · drag souris idem
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
# Laisse les apps (nvim/herdr) écrire le presse-papier via OSC52
set -g set-clipboard on

# ─── Recharger la config ───
bind r source-file ~/.tmux.conf \; display "Config rechargée !"

# ─── herdr : UNE seule fenêtre dédiée, jamais en split ───
# Splitter herdr = inutile : 2 panes = 2 clients de la session "main" =
# vue MIROIR (mêmes tabs/actions des deux côtés). herdr gère son propre
# multiplexing en interne ; tmux lui donne juste 1 fenêtre.
# prefix+g → va sur la fenêtre "herdr" si elle existe, sinon la crée.
# (env -u … : scrube HERDR_* hérité, sinon "nested herdr is disabled".)
bind g if-shell -F '#{==:#{window_name},herdr}' '' \
  "run-shell \"tmux select-window -t :herdr 2>/dev/null || tmux new-window -n herdr 'env -u HERDR_ENV -u HERDR_SESSION -u HERDR_PANE_ID -u HERDR_SOCKET_PATH herdr --session main'\""

# ─── Taskwarrior : popup SPLIT (gauche task · droite opencode) ───
# Ouvre : prefix+T   OU   clic gauche sur le ✓ de la barre de statut.
# Layout : gauche = task next + shell, droite = opencode (62% largeur).
# Détail nesting → ~/.config/tmux/task-popup.sh. Ferme : exit/Ctrl+D les 2 panes.
bind T display-popup -E -d "#{pane_current_path}" -w 92% -h 88% -T " tasks · opencode " \
  "~/.config/tmux/task-popup.sh"
# Clic gauche sur la zone droite de la barre (le ✓N) → même popup split
bind -n MouseDown1StatusRight display-popup -E -d "#{pane_current_path}" -w 92% -h 88% -T " tasks · opencode " \
  "~/.config/tmux/task-popup.sh"
# Ajout rapide : prefix+a → prompt inline en bas, puis bump du compteur ✓
bind a command-prompt -p "task add:" \
  "run-shell 'task add %% && tmux refresh-client -S && tmux display-message \"✓ tâche ajoutée\"'"

# ─── Barre de statut : thème terminal vert sur noir ───
set -g status-style "bg=#0d1117,fg=#4caf50"
set -g status-left "#[fg=#39ff14,bold] [#S] "
set -g status-right "#(~/.config/tmux/task-status.sh) #[fg=#3d4451]| #[fg=#4caf50]%H:%M #[fg=#3d4451]| #[fg=#b5c9a8]%d/%m/%Y "
set -g status-right-length 60
set -g window-status-format "#[fg=#3d4451] #I:#W "
set -g window-status-current-format "#[fg=#39ff14,bold] #I:#W "
set -g status-left-length 20

# ─── Pas de délai sur Escape (important pour vim/nvim) ───
set -sg escape-time 0
set -g focus-events on

# ─── QoL ───
set -g renumber-windows on          # pas de trous dans la numérotation
setw -g aggressive-resize on        # resize selon le plus petit client visible
setw -g monitor-activity on         # marque les fenêtres qui bougent en fond
set -g visual-activity off          # pas de message intrusif, juste le marqueur

# Bordure de pane : commande + chemin courant
set -g pane-border-status top
set -g pane-border-format " #P:#{pane_current_command} #{pane_current_path} "
set -g pane-border-style "fg=#3d4451"
set -g pane-active-border-style "fg=#39ff14"

# ─── Plugins (tpm) : persistance au reboot ───
# Install : prefix + I   |   Update : prefix + U   |   Clean : prefix + alt+u
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'       # restaure auto la dernière session au démarrage
set -g @continuum-save-interval '15' # sauvegarde toutes les 15 min
# tpm doit rester en DERNIÈRE ligne
run '~/.tmux/plugins/tpm/tpm'
